# Calibration data for hw_dse.models.cost_fpga (Artix-7, Vivado).
#
# WARNING: this is a WEAK calibration. Two anchor points (the reference
# iterative and pipelined CORDICs at the default W=16, N=14) fix five free
# constants: each anchor is reproduced, but the model is an extrapolation
# everywhere else and is uncalibrated for unrolled_k and pipelined_m.
# Milestone 2 adds real synthesis runs across the design space and refits.
#
# Every number in a report that comes from this model is labelled
# "estimate: cost_fpga (<id>, 2 anchors)".

id: artix7-xc7a35t-vivado2025.2-2anchor-v1
device: xc7a35tcpg236-1
tool: >-
  Vivado 2025.2, synth_design only (post-synthesis, unplaced: timing uses
  Vivado's net-delay estimates), 10.000 ns clock constraint on CLK.
  Fmax = 1000 / (10 - WNS).

anchors:
  - family: iterative
    params: {data_width: 16, n_iter: 14, angle_guard: 0, frac_guard: 0, rounding: trunc}
    luts: 170
    ffs: 95
    fmax_mhz: 198.3
    source: >-
      CORDIC repo README synthesis table (commit 5bd6bf5);
      synthesis_logs/utilization_cordic_rotation_iterative.rpt (Slice LUTs 170,
      Slice Registers 95 = 86 FDRE + 9 FDSE);
      synthesis_logs/timing_cordic_rotation_iterative.rpt (WNS 4.957 ns;
      path y_reg[15] -> x_reg[17], 8 levels: LUT6, LUT3, LUT6, 5x CARRY4).
  - family: pipelined
    params: {data_width: 16, n_iter: 14, angle_guard: 0, frac_guard: 0, rounding: trunc}
    luts: 745
    ffs: 784
    fmax_mhz: 272.9
    source: >-
      CORDIC repo README synthesis table (commit 5bd6bf5);
      synthesis_logs/utilization_cordic_rotation_pipelined.rpt (Slice LUTs 745,
      Slice Registers 784 FDRE, CARRY4 201);
      synthesis_logs/timing_cordic_rotation_pipelined.rpt (WNS 6.336 ns;
      path x_pipe_reg[0][0] -> y_pipe_reg[1][16], 6 levels: LUT1, 4x CARRY4, LUT3).

# Primitive delays read directly off the two timing reports (not fitted).
source_constants:
  t_clk2q_ns: 0.467          # FDRE Prop_fdre_C_Q: 0.478 (iterative), 0.456 (pipelined)
  t_clk_overhead_ns: 0.128   # (10 - WNS) - data path delay: 0.104 and 0.151 (skew, uncertainty, setup)
  t_carry_first_ns: 0.616    # first CARRY4 S/CYINIT -> CO[3]: 0.637 and 0.595
  t_carry_mid_ns: 0.117      # CARRY4 CI -> CO[3], both reports
  t_carry_last_ns: 0.334     # CARRY4 CI -> O[n]: 0.337 and 0.331
  activity_factor: 0.125     # Vivado's default toggle rate for unspecified nets

# Free constants solved from the anchors by cost_fpga.calibrate().
# tests/test_cost_model.py fails if these drift from what calibrate() returns.
fitted:
  c_arith: 1.053748
  c_mux: 0.754118
  c_ff: 1.008927
  t_logic_ns: 0.884173
  t_mux_ns: 1.131346

# The power index is (LUTs + FFs) * f_op * activity, normalised so this
# design at this clock scores 1.0. It is relative and unitless: never watts.
power_reference:
  family: iterative
  params: {data_width: 16, n_iter: 14, angle_guard: 0, frac_guard: 0, rounding: trunc}
  f_mhz: 100.0
